<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghostwriter</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/api.js"></script>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="back-link">← All Books</a>
    <h1 id="header-title">Loading…</h1>
  </div>
</header>

<div class="container">
  <div id="error-banner" hidden></div>
  <div id="root"></div>
</div>

<!-- Loading overlay (shown during LLM calls) -->
<div id="overlay" hidden>
  <div class="overlay-box">
    <div class="spinner"></div>
    <p id="loading-msg">Working…</p>
  </div>
</div>

<script>
// ── Utilities ──

const bookId = location.pathname.split('/').filter(Boolean).pop();

function escHtml(s) {
  return (s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function badge(status) {
  const map = {
    pending:        ['badge-gray',   'Pending'],
    processing:     ['badge-orange', 'Generating…'],
    in_review:      ['badge-orange', 'In Review'],
    needs_revision: ['badge-orange', 'Regenerating…'],
    approved:       ['badge-green',  'Approved'],
    error:          ['badge-red',    'Error'],
    completed:      ['badge-green',  'Completed'],
  };
  const [cls, label] = map[status] || ['badge-gray', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

// ── State ──

const POLL_MS = 2000;
let book = null;
let chapters = [];
let pollTimer = null;

function isBusy() {
  if (!book) return false;
  if (book.outline_status === 'processing') return true;
  if (book.final_status === 'processing') return true;
  return chapters.some(ch => ch.status === 'processing');
}

async function load() {
  const [b, chs] = await Promise.all([
    api('GET', `/api/books/${bookId}`),
    api('GET', `/api/chapters/${bookId}`),
  ]);
  book = b;
  chapters = chs;
  render();
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
  setLoading(false);
}

function startPolling(msg = 'Working…') {
  setLoading(true, msg);
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    try {
      await load();
      if (!isBusy()) stopPolling();
    } catch (e) {
      setError(e.message);
      stopPolling();
    }
  }, POLL_MS);
}

// ── Action runner ──

async function runWorkflow(postFn, msg = 'Working…') {
  setError(null);
  try {
    await postFn();
    await load();
    if (isBusy()) startPolling(msg);
  } catch (e) {
    setError(e.message);
  }
}

function setLoading(on, msg = '') {
  document.getElementById('overlay').hidden = !on;
  document.getElementById('loading-msg').textContent = msg;
}

function setError(msg) {
  const el = document.getElementById('error-banner');
  if (msg) { el.textContent = '⚠ ' + msg; el.hidden = false; }
  else { el.hidden = true; }
}

function toggleSection(id) {
  const el = document.getElementById(id);
  if (el) el.hidden = !el.hidden;
}

function renderStuckJobActions(kind, chapterId) {
  const hint = '<p class="muted" style="margin-top:.5rem;font-size:.8125rem">Taking too long? The server may have restarted.</p>';
  if (kind === 'outline') {
    return `${hint}<div class="actions">
      <button class="btn-secondary" onclick="cancelOutlineJob()">Cancel</button>
      <button onclick="retryOutlineJob()">Retry</button>
    </div>`;
  }
  if (kind === 'compilation') {
    return `${hint}<div class="actions">
      <button class="btn-secondary" onclick="cancelCompilationJob()">Cancel</button>
      <button onclick="retryCompilationJob()">Retry</button>
    </div>`;
  }
  return `${hint}<div class="actions">
    <button class="btn-secondary" onclick="cancelChapterJob('${chapterId}')">Cancel</button>
    <button onclick="retryChapterJob('${chapterId}')">Retry</button>
  </div>`;
}

// ── Render ──

function render() {
  const title = book.title || 'Untitled';
  document.getElementById('header-title').textContent = title;
  document.title = `${title} — Ghostwriter`;
  document.getElementById('root').innerHTML =
    renderOutlineCard() +
    renderChaptersCard() +
    renderCompilationCard();
}

// ── Outline card ──

function renderOutlineCard() {
  const st = book.outline_status;
  let body = '';

  if (st === 'pending') {
    body += `
      <div style="margin-bottom:1rem">
        <p class="muted" style="margin-bottom:.375rem"><strong>Editorial notes</strong></p>
        <div class="content-box" style="max-height:160px">${escHtml(book.notes_before_outline)}</div>
      </div>
      <button onclick="genOutline()">Generate Outline</button>`;

  } else if (st === 'in_review') {
    if (book.notes_after_outline) {
      body += `<p class="muted" style="margin-bottom:.5rem">
        Last revision notes: <em>${escHtml(book.notes_after_outline)}</em>
      </p>`;
    }
    body += `<div class="content-box">${escHtml(book.outline)}</div>`;
    if (book.outline_parse_ok && book.outline_chapters?.length) {
      const items = book.outline_chapters
        .map(ch => `<li>Chapter ${ch.chapter_index}: ${escHtml(ch.title)}</li>`)
        .join('');
      body += `<p class="muted" style="margin:.75rem 0 .375rem"><strong>Parsed chapters</strong></p>
        <ul class="chapter-parse-list">${items}</ul>`;
    } else if (!book.outline_parse_ok) {
      body += `<p class="warning-text">⚠ This outline has no parseable chapter headings. Request a revision and ask for the format &quot;Chapter 1: Title&quot;.</p>`;
    }
    const canApprove = book.outline_parse_ok;
    body += `
      <div class="actions">
        <button class="btn-success" onclick="approveOutline()"${canApprove ? '' : ' disabled'}>Approve &amp; Start Chapters</button>
        <button class="btn-secondary" onclick="toggleSection('outline-rev')">Request Revision</button>
      </div>
      <div id="outline-rev" class="revision-form" hidden>
        <textarea id="outline-notes" rows="4"
          placeholder="What would you like changed? Be specific."></textarea>
        <button onclick="submitOutlineNotes()">Submit &amp; Regenerate</button>
      </div>`;

  } else if (st === 'processing' || st === 'needs_revision') {
    body += `<p class="muted">Generating outline…</p>`;
    body += renderStuckJobActions('outline');

  } else if (st === 'approved') {
    body += `
      <details>
        <summary>View approved outline</summary>
        <div class="content-box">${escHtml(book.outline)}</div>
      </details>`;

  } else if (st === 'error') {
    if (book.outline) {
      body += `<div class="content-box">${escHtml(book.outline)}</div>`;
    }
    body += `
      <p class="error-text">⚠ ${escHtml(book.error_message || 'Generation failed. Check logs for details.')}</p>
      <div class="actions">
        <button onclick="genOutline()">Retry</button>
        <button class="btn-secondary" onclick="toggleSection('outline-rev')">Request Revision</button>
      </div>
      <div id="outline-rev" class="revision-form" hidden>
        <textarea id="outline-notes" rows="4"
          placeholder="What would you like changed? Be specific."></textarea>
        <button onclick="submitOutlineNotes()">Submit &amp; Regenerate</button>
      </div>`;
  }

  return `<div class="card"><h2>Outline ${badge(st)}</h2>${body}</div>`;
}

// ── Chapters card ──

function renderChaptersCard() {
  if (book.outline_status !== 'approved') return '';

  let body = '';
  if (!chapters.length) {
    body = '<p class="muted">Setting up chapters…</p>';
  } else {
    body = chapters.map(renderChapter).join('');
  }

  return `<div class="card"><h2>Chapters</h2>${body}</div>`;
}

function renderChapter(ch) {
  const st = ch.status;
  const chNum = `Ch. ${ch.chapter_index}`;
  let body = '';

  if (st === 'in_review' || st === 'approved') {
    if (ch.content) {
      const open = st === 'in_review' ? ' open' : '';
      body += `
        <details${open}>
          <summary>Read chapter</summary>
          <div class="content-box">${escHtml(ch.content)}</div>
        </details>`;
    }
  }

  if (st === 'in_review') {
    body += `
      <div class="actions">
        <button class="btn-success" onclick="approveChapter('${ch.id}')">Approve</button>
        <button class="btn-secondary" onclick="toggleSection('ch-${ch.id}-rev')">Request Revision</button>
      </div>
      <div id="ch-${ch.id}-rev" class="revision-form" hidden>
        <textarea id="ch-${ch.id}-notes" rows="4"
          placeholder="What would you like changed?"></textarea>
        <button onclick="submitChapterNotes('${ch.id}')">Submit &amp; Regenerate</button>
      </div>`;

  } else if (st === 'error') {
    body += `
      <p class="error-text">⚠ ${escHtml(ch.error_message || 'Generation failed.')}</p>
      <div class="actions">
        <button onclick="retryChapter('${ch.id}')">Retry</button>
      </div>`;

  } else if (st === 'pending') {
    body += `<p class="muted" style="padding:.375rem 0">Queued</p>`;

  } else if (st === 'processing' || st === 'needs_revision') {
    body += `<p class="muted" style="padding:.375rem 0">Generating…</p>`;
    body += renderStuckJobActions('chapter', ch.id);
  }

  return `
    <div class="chapter-card">
      <div class="chapter-header">
        <span class="chapter-num">${chNum}</span>
        <span class="chapter-title">${escHtml(ch.title || '')}</span>
        ${badge(st)}
      </div>
      ${body ? `<div class="chapter-body">${body}</div>` : ''}
    </div>`;
}

// ── Compilation card ──

function renderCompilationCard() {
  const st = book.final_status;
  if (!['in_review', 'completed', 'processing', 'error'].includes(st)) return '';

  let body = '';
  if (st === 'processing') {
    body = '<p class="muted">Compiling book…</p>';
    body += renderStuckJobActions('compilation');
  } else if (st === 'in_review') {
    body = `
      <p style="margin-bottom:1rem">
        All chapters approved. Ready to compile into
        <code>.docx</code> and <code>.txt</code>.
      </p>
      <button onclick="compile()">Compile Book</button>`;
  } else if (st === 'error') {
    body = `
      <p class="error-text">⚠ ${escHtml(book.error_message || 'Compilation failed.')}</p>
      <button onclick="compile()">Retry Compile</button>`;
  } else {
    body = `
      <p class="success-text" style="margin-bottom:.5rem">✓ Compiled successfully</p>
      <p>Output saved to: <code>${escHtml(book.output_path)}</code></p>`;
  }

  return `<div class="card"><h2>Final Compilation ${badge(st)}</h2>${body}</div>`;
}

// ── Action handlers ──

function genOutline() {
  runWorkflow(
    () => api('POST', `/api/workflow/${bookId}/generate-outline`),
    'Generating outline…',
  );
}

function approveOutline() {
  runWorkflow(
    () => api('POST', `/api/workflow/${bookId}/approve-outline`),
    'Generating Chapter 1…',
  );
}

function submitOutlineNotes() {
  const notes = document.getElementById('outline-notes').value;
  if (!notes.trim()) { setError('Please enter revision notes before submitting.'); return; }
  runWorkflow(
    () => api('POST', `/api/workflow/${bookId}/submit-outline-notes`, { notes }),
    'Regenerating outline…',
  );
}

function approveChapter(id) {
  runWorkflow(
    () => api('POST', `/api/workflow/chapter/${id}/approve`),
    'Working on next chapter…',
  );
}

function submitChapterNotes(id) {
  const notes = document.getElementById(`ch-${id}-notes`).value;
  if (!notes.trim()) { setError('Please enter revision notes before submitting.'); return; }
  runWorkflow(
    () => api('POST', `/api/workflow/chapter/${id}/submit-notes`, { notes }),
    'Regenerating chapter…',
  );
}

function retryChapter(id) {
  runWorkflow(
    () => api('POST', `/api/workflow/chapter/${id}/retry`),
    'Retrying chapter generation…',
  );
}

function compile() {
  runWorkflow(
    () => api('POST', `/api/workflow/${bookId}/compile`),
    'Compiling book…',
  );
}

async function cancelOutlineJob() {
  await runWorkflow(
    () => api('POST', `/api/workflow/${bookId}/recover-outline`, { action: 'cancel' }),
    'Cancelling…',
  );
}

function retryOutlineJob() {
  runWorkflow(
    () => api('POST', `/api/workflow/${bookId}/recover-outline`, { action: 'retry' }),
    'Retrying outline…',
  );
}

async function cancelCompilationJob() {
  await runWorkflow(
    () => api('POST', `/api/workflow/${bookId}/recover-compilation`, { action: 'cancel' }),
    'Cancelling…',
  );
}

function retryCompilationJob() {
  runWorkflow(
    () => api('POST', `/api/workflow/${bookId}/recover-compilation`, { action: 'retry' }),
    'Retrying compilation…',
  );
}

async function cancelChapterJob(id) {
  await runWorkflow(
    () => api('POST', `/api/workflow/chapter/${id}/recover`, { action: 'cancel' }),
    'Cancelling…',
  );
}

function retryChapterJob(id) {
  runWorkflow(
    () => api('POST', `/api/workflow/chapter/${id}/recover`, { action: 'retry' }),
    'Retrying chapter…',
  );
}

ensureApiKeyConfigured()
  .then(() => load())
  .then(() => { if (isBusy()) startPolling('Working…'); })
  .catch(e => {
    setError('Failed to load book: ' + e.message);
    document.getElementById('header-title').textContent = 'Error';
  });
</script>

</body>
</html>
